<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscador de repositorios de GitHub</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <div class="encabezado">
            <h1>Buscador de repositorios</h1>
        </div>

        <select id="selectorLenguaje">
            <option value="">Selecciona un lenguaje</option>
        </select>

        <div id="resultado" class="resultado vacio">Por favor selecciona un lenguaje</div>

        <button id="botonAccion" class="botonAccion oculto" type="button"></button>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
